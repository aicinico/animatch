name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  web:
    name: Interface
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build

  api:
    name: API
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      # Also creates the JWT keys (see api/frankenphp/docker-entrypoint.sh)
      - name: Start the API
        run: docker compose up --build --wait
      - name: Check coding style
        run: docker compose exec -T php vendor/bin/php-cs-fixer fix --dry-run --diff
      - name: Static analysis
        run: docker compose exec -T php vendor/bin/phpstan analyse --no-progress
      - name: Create the test database
        run: docker compose exec -T php bin/console doctrine:database:create --env=test
      - name: Run PHPUnit
        run: docker compose exec -T php bin/phpunit

  e2e:
    name: Bout en bout
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            e2e/package-lock.json
      # Also creates the JWT keys (see api/frankenphp/docker-entrypoint.sh)
      - name: Start the API
        working-directory: api
        run: docker compose up --build --wait
      - name: Install the interface dependencies
        working-directory: web
        run: npm ci
      - name: Install the test dependencies
        working-directory: e2e
        run: npm ci
      - name: Check coding style
        working-directory: e2e
        run: npm run format:check
      - name: Install the browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium webkit
      - name: Run Playwright
        working-directory: e2e
        run: npm test
      - name: Attach the Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/playwright-report/

  report:
    name: Publication du rapport
    needs: e2e
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: playwright-report
          path: report
      - uses: actions/upload-pages-artifact@v5
        with:
          path: report
      - id: deployment
        uses: actions/deploy-pages@v5
