security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: 'auto'

    # Where to find the accounts
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                # No "property": UserRepository::loadUserByIdentifier() does the lookup

    firewalls:
        dev:
            # Ensure dev tools and static assets are always allowed
            pattern: ^/(_profiler(/|$)|(_wdt|assets|build)/)
            security: false

        # Checks email + password, then returns a JWT
        login:
            pattern: ^/api/login$
            stateless: true
            provider: app_user_provider
            json_login:
                check_path: /api/login
                username_path: email
                password_path: password
                success_handler: lexik_jwt_authentication.handler.authentication_success
                failure_handler: lexik_jwt_authentication.handler.authentication_failure

        # Reads the JWT on every other request (must stay after "login")
        api:
            pattern: ^/
            stateless: true
            provider: app_user_provider
            # Two ways to authenticate here: tell Symfony which one answers
            # an anonymous request (JWT -> 401)
            entry_point: jwt
            jwt: ~
            # Exchanges a refresh token for a new JWT + refresh token
            refresh_jwt:
                check_path: /api/token/refresh

    # Read from top to bottom: the first matching line wins
    access_control:
        # Open to everyone
        - { path: '^/health$', roles: PUBLIC_ACCESS }
        - { path: '^/api/(login|token/refresh|register/adopter)$', roles: PUBLIC_ACCESS }
        # API documentation (Swagger) and the descriptions it links to
        - { path: '^/api/?$', roles: PUBLIC_ACCESS }
        - { path: '^/api/(docs|contexts|errors|validation_errors|\.well-known)(/|\.|$)', roles: PUBLIC_ACCESS }
        # Everything else is closed by default: a valid JWT is required
        - { path: '^/', roles: IS_AUTHENTICATED_FULLY }

when@test:
    security:
        password_hashers:
            # Password hashers are resource-intensive by design to ensure security.
            # In tests, it's safe to reduce their cost to improve performance.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
